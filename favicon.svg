<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <style>
      :root {
        --vol-main: #18181b;
        --vol-sub: #27272a;
        --ribbon: #c2410c;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --vol-main: #f4f4f5;
          --vol-sub: #d4d4d8;
          --ribbon: #ea580c;
        }
      }
    </style>
  </defs>

  <!-- Left Architectural Volume (Primary Page) -->
  <path d="M16.5 16 H28 V51 H16.5 C14.8 51 13.5 49.7 13.5 48 V19 C13.5 17.3 14.8 16 16.5 16 Z" 
        fill="var(--vol-main)" />

  <!-- Right Offset Volume (Secondary Page with Editorial Shift) -->
  <path d="M36 13 H47.5 C49.2 13 50.5 14.3 50.5 16 V45 C50.5 46.7 49.2 48 47.5 48 H36 V13 Z" 
        fill="var(--vol-sub)" 
        fill-opacity="0.82" />

  <!-- The Reading Ribbon Accent (Descending into the Negative Space Rift) -->
  <path d="M30 9 H34 V28.5 L32 26.5 L30 28.5 Z" 
        fill="var(--ribbon)" />
</svg>
