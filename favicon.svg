<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    :root {
      --page-fill: #ffffff;
      --main-stroke: #18181b;
      --sub-stroke: #71717a;
      --ribbon: #e05638;
      --shadow: rgba(0, 0, 0, 0.08);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --page-fill: #222226;
        --main-stroke: #f4f4f5;
        --sub-stroke: #a1a1aa;
        --ribbon: #ff6542;
        --shadow: rgba(0, 0, 0, 0.35);
      }
    }
  </style>

  <!-- Subtle Ambient Paper Shadow -->
  <path d="M4 8.5 C7.5 7 12 7.6 15 9 L15 24.2 C12 22.8 7.5 22.2 4 23.7 Z" fill="var(--shadow)" />
  <path d="M28 8.5 C24.5 7 20 7.6 17 9 L17 24.2 C20 22.8 24.5 22.2 28 23.7 Z" fill="var(--shadow)" />

  <!-- Artisan Reading Ribbon Accent (draping down the spine) -->
  <path d="M14.5 3.5 H17.5 V12 L16 10.8 L14.5 12 V3.5 Z" fill="var(--ribbon)" />

  <!-- Left Open Page with Paper Fill -->
  <path d="M4.5 7.8 C7.8 6.4 12 7 15 8.3 V23.3 C12 22 7.8 21.4 4.5 22.8 Z" 
        fill="var(--page-fill)" 
        stroke="var(--main-stroke)" 
        stroke-width="1.8" 
        stroke-linecap="round"
        stroke-linejoin="round" />

  <!-- Right Open Page with Paper Fill -->
  <path d="M27.5 7.8 C24.2 6.4 20 7 17 8.3 V23.3 C20 22 24.2 21.4 27.5 22.8 Z" 
        fill="var(--page-fill)" 
        stroke="var(--main-stroke)" 
        stroke-width="1.8" 
        stroke-linecap="round"
        stroke-linejoin="round" />

  <!-- Center Spine Fold -->
  <line x1="16" y1="8.3" x2="16" y2="23.5" 
        stroke="var(--main-stroke)" 
        stroke-width="1.8" 
        stroke-linecap="round" />

  <!-- Minimalist Layout Grid Lines (Editorial Prose Rhythm) -->
  <line x1="7.8" y1="12.2" x2="12.2" y2="12.8" 
        stroke="var(--sub-stroke)" 
        stroke-width="1.2" 
        stroke-linecap="round" />
  <line x1="7.8" y1="15.8" x2="12.2" y2="16.4" 
        stroke="var(--sub-stroke)" 
        stroke-width="1.2" 
        stroke-linecap="round" />
  <line x1="19.8" y1="12.8" x2="24.2" y2="12.2" 
        stroke="var(--sub-stroke)" 
        stroke-width="1.2" 
        stroke-linecap="round" />
  <line x1="19.8" y1="16.4" x2="24.2" y2="15.8" 
        stroke="var(--sub-stroke)" 
        stroke-width="1.2" 
        stroke-linecap="round" />
</svg>
